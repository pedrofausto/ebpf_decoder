intercept:
  - port: 443
    protocol: tcp
    format: html
    action: decode
  - port: 8080
    protocol: tcp
    format: json
    action: decode
    inject: "classification:application_log"
  - port: 53
    protocol: udp
    format: plain_text
    action: check
  - port: 514
    protocol: udp
    format: syslog
    action: decode
    inject: "classification:syslog"
